name: Benachrichtigungen

# Schickt eine Push-Nachricht direkt an einen Gotify-Server bei
#  - jedem Release-Build (Erfolg, Fehler, Abbruch),
#  - fehlgeschlagenen Tests auf main,
#  - Pull Requests von Dependabot (Tests bestanden oder fehlgeschlagen),
#  - einer Probenachricht, die sich unter Actions > Benachrichtigungen > Run workflow auslösen lässt.
# Fremde Pull Requests lösen keine Nachricht aus.
#
# Secrets: GOTIFY_URL (https://...) und GOTIFY_TOKEN (App-Token). Der Server muss aus dem Internet
# erreichbar sein, denn die Läufe kommen von GitHub. Für Dependabot-Läufe müssen die Secrets zusätzlich
# unter Settings > Secrets and variables > Dependabot angelegt werden, sonst bleibt die Nachricht aus.
on:
  workflow_run:
    workflows: [Build, Tests]
    types: [completed]
  workflow_dispatch:
    inputs:
      ergebnis:
        description: Ergebnis der Probenachricht
        type: choice
        options: [success, failure, cancelled]
        default: success

# Der Workflow braucht keinen Zugriff auf das Repository
permissions: {}

jobs:
  notify:
    name: Nachricht senden
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.name == 'Build'
      || (github.event.workflow_run.name == 'Tests'
          && github.event.workflow_run.conclusion == 'failure'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main')
      || (github.event.workflow_run.name == 'Tests'
          && github.event.workflow_run.event == 'pull_request'
          && github.event.workflow_run.actor.login == 'dependabot[bot]')
    steps:
      - name: Nachricht senden
        env:
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          # Werte aus dem Auslöser nie in das Skript einsetzen, nur über Umgebungsvariablen lesen
          WORKFLOW: ${{ github.event.workflow_run.name || 'Probenachricht' }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion || inputs.ergebnis }}
          EVENT: ${{ github.event.workflow_run.event || github.event_name }}
          REF: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          ACTOR: ${{ github.event.workflow_run.actor.login || github.actor }}
          RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GOTIFY_URL:-}" ] || [ -z "${GOTIFY_TOKEN:-}" ]; then
            echo "::warning::Secrets für die Benachrichtigung fehlen, es wird nichts gesendet."
            exit 0
          fi
          case "$GOTIFY_URL" in
            https://*) ;;
            *) echo "::warning::GOTIFY_URL muss mit https:// beginnen, der Token wird nicht unverschlüsselt gesendet."; exit 0 ;;
          esac

          case "$CONCLUSION" in
            success)   emoji="✅"; result="Erfolgreich";     priority=4 ;;
            cancelled) emoji="⚪"; result="Abgebrochen";     priority=3 ;;
            *)         emoji="❌"; result="Fehlgeschlagen";  priority=8 ;;
          esac

          if [ "$EVENT" = "workflow_dispatch" ]; then
            kind="Probenachricht"
          elif [ "$ACTOR" = "dependabot[bot]" ]; then
            kind="Dependabot"
          elif [ "$WORKFLOW" = "Build" ]; then
            kind="Release-Build"
          else
            kind="Tests auf main"
          fi

          title="$emoji $kind: $result"
          body=$(printf 'Repository: %s\nWorkflow: %s\nAuslöser: %s (%s)\nZweig/Tag: %s\n\n%s' \
            "$REPO" "$WORKFLOW" "$ACTOR" "$EVENT" "$REF" "$RUN_URL")

          payload=$(jq -n --arg title "$title" --arg message "$body" --argjson priority "$priority" \
            '{title: $title, message: $message, priority: $priority}')
          curl --silent --show-error --fail-with-body --max-time 20 \
            -X POST -H "Content-Type: application/json" -H "X-Gotify-Key: ${GOTIFY_TOKEN}" \
            -d "$payload" "${GOTIFY_URL%/}/message"
